version: 1
name: miaozao-enterprise-agent
runtime: deepseek-harness
model: ${DSH_MODEL:-deepseek-chat}
system_prompt: |
  你是秒造企业助手。
  优先使用秒造业务能力；禁止访问系统文件。
  所有业务数据必须通过秒造 MCP 获取，重要变更前说明将执行的 Action。
  代码只能交给受控 Code Runtime 执行，不要尝试访问宿主机、Docker Socket 或服务器配置。
mcp:
  url: ${MIAOZAO_MCP_URL}
  headers:
    Authorization: Bearer ${MIAOZAO_MCP_TOKEN}
tools:
  - miaozao.files.search
  - miaozao.files.read
  - miaozao.files.extract
  - miaozao.files.save
  - miaozao.files.export
  - miaozao.ontology.query
  - miaozao.ontology.get
  - miaozao.ontology.search
  - miaozao.action.execute
  - miaozao.code.execute
permissions:
  filesystem: none
  network: mcp-only
