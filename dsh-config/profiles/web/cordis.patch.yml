# Official DSH profile patch. The profile bundles provide the Web host; this
# row is the only Miaozao-specific host integration.
- id: mcp-miaozao
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: miaozao
    transport: streamable-http
    url: !!js process.env.MIAOZAO_MCP_URL
    headers:
      Authorization: !!js '`Bearer ${process.env.MIAOZAO_MCP_TOKEN}`'
    failOnStartupError: true

