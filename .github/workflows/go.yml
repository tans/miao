name: Go server

on:
  push:
    branches: [main, feat/go-rewrite]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: mkdir -p dist && go build -trimpath -o dist/miao .
