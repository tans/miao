services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
  runtime:
    build:
      context: .
      args:
        BASE_IMAGE: ${MIAOZAO_BUN_BASE:-miaozao/bun-base:1.3.6}
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "41874:41874"
    environment:
      DATA_DIR: /data
      UPLOADS_DIR: /data/files
      EXTRACTED_DIR: /data/extracted
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: agent_native_runtime
      HOST: 0.0.0.0
      PORT: 41874
      MIAOZAO_INTERNAL_TOKEN: ${MIAOZAO_INTERNAL_TOKEN:-}
      MIAOZAO_MCP_TOKEN: ${MIAOZAO_MCP_TOKEN:-}
    volumes:
      - ${MIAOZAO_DATA_DIR:-./data}:/data
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
      args:
        DSH_VERSION: ${DSH_VERSION:-0.1.1-rc.2}
    image: miaozao-dsh:${DSH_VERSION:-0.1.1-rc.2}
    profiles: ["agent"]
    restart: unless-stopped
    depends_on:
      - runtime
    ports:
      - "${DSH_PORT:-41875}:8080"
    environment:
      MIAOZAO_MCP_URL: ${MIAOZAO_MCP_URL:-http://runtime:41874/api/mcp/user}
      MIAOZAO_SESSION_CREATE_URL: ${MIAOZAO_SESSION_CREATE_URL:-http://runtime:41874/api/mcp/session/create}
      MIAOZAO_INTERNAL_TOKEN: ${MIAOZAO_INTERNAL_TOKEN:-}
      MIAOZAO_MCP_TOKEN: ${MIAOZAO_MCP_TOKEN:-}
      MIAOZAO_SESSION_TOKEN: ${MIAOZAO_SESSION_TOKEN:-}
      MIAOZAO_SESSION_APP_ID: ${MIAOZAO_SESSION_APP_ID:-}
      MIAOZAO_SESSION_MODE: ${MIAOZAO_SESSION_MODE:-user}
      MIAOZAO_AGENT_ID: ${MIAOZAO_AGENT_ID:-dsh}
      MIAOZAO_SESSION_USER_ID: ${MIAOZAO_SESSION_USER_ID:-}
      MIAOZAO_SESSION_PERMISSIONS: ${MIAOZAO_SESSION_PERMISSIONS:-}
      DSH_HOME: /home/node/.dsh
      DSH_INTERNAL_PORT: 3080
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    volumes:
      - dsh_workspaces:/workspace
      - dsh_data:/home/node/.dsh
volumes:
  mongo_data:
  dsh_workspaces:
  dsh_data:
